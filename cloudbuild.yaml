steps:
  # React (CRA) hornea las variables REACT_APP_* en el bundle durante "npm run build",
  # que corre DENTRO del Dockerfile. Por eso no alcanza con configurarlas como variables
  # de entorno del servicio de Cloud Run (eso solo aplica en runtime, cuando el bundle
  # ya esta compilado) - hay que pasarlas como --build-arg en este paso.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'REACT_APP_BLH_EAS_API_BASE_URL=https://github-blh-eas-back-qa-228405537736.us-west1.run.app/'
      - '--build-arg'
      - 'REACT_APP_BLH_EAS_API_PATH_LOGIN=api/login'
      - '--build-arg'
      - 'REACT_APP_BLH_CURRENCY_API_BASE_URL=https://currency.blhinternal.com'
      - '--build-arg'
      - 'REACT_APP_DEFAULT_ALLOW_FILES_MIMETYPES=application/pdf,image/*,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.oasis.opendocument.spreadsheet,application/vnd.oasis.opendocument.text'
      - '-t'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_AR_IMAGE_NAME:$COMMIT_SHA'
      - '.'

images:
  - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_AR_IMAGE_NAME:$COMMIT_SHA'

substitutions:
  _AR_HOSTNAME: us-west1-docker.pkg.dev
  _AR_PROJECT_ID: cdn-storage-228019
  _AR_REPOSITORY: cloud-run-source-deploy
  _AR_IMAGE_NAME: blh-eas-front/github-blh-eas-front-qa

options:
  logging: CLOUD_LOGGING_ONLY
