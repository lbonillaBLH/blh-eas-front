version: '3'
services:
  blh-eas-front:
    container_name: 'blh-eas-front'
    ports: 
      - 3000:3000
    volumes:
      - ./:/home/node/
      - /home/node/node_modules/
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        REACT_APP_BLH_EAS_API_BASE_URL: ${REACT_APP_BLH_EAS_API_BASE_URL}
        REACT_APP_BLH_EAS_API_PATH_LOGIN: ${REACT_APP_BLH_EAS_API_PATH_LOGIN}
        REACT_APP_BLH_CURRENCY_API_BASE_URL: ${REACT_APP_BLH_CURRENCY_API_BASE_URL}
        REACT_APP_DEFAULT_ALLOW_FILES_MIMETYPES: ${REACT_APP_DEFAULT_ALLOW_FILES_MIMETYPES}
    entrypoint: npm start
    tty: true
    env_file:
      - .env
